[project]
name = "complexui-backend"
version = "0.1.0"
description = "ComplexUI backend: visual, code-first node graph IDE for Machine Learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "httpx2>=2.13.1",
    "numpy>=2.5.4",
    "packaging>=26.3",
    "polars>=2.0.0",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "fastexcel>=0.21.0",
    "httpx2>=2.13.1",
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "plotly>=7.1.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
