[project]
name = "complexui-backend"
version = "0.1.0"
description = "ComplexUI backend: visual, code-first node graph IDE for Machine Learning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.144.0",
    "httpx2>=2.13.1",
    "numpy>=2.5.4",
    "nvidia-ml-py>=13.0",
    "packaging>=26.3",
    "polars>=2.0.0",
    "psutil>=7.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["app"]
omit = ["app/templates/*"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/templates"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "accelerate>=1.0",
    "basedpyright>=1.40",
    "diffusers>=0.31",
    "fastexcel>=0.21.0",
    "httpx2>=2.13.1",
    "imageio-ffmpeg>=0.5",
    "imbalanced-learn>=0.14.2",
    "matplotlib>=3.11.2",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.4",
    "opencv-python>=4.9",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "pillow>=11.0",
    "plotly>=7.1.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.0",
    "pywavelets>=1.6",
    "ruff>=0.17.1",
    "safetensors>=0.4",
    "torch>=2.2",
    "torchsde>=0.2.6",
    "torchvision>=0.17",
    "transformers>=4.46",
    "ultralytics>=8.3",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'" },
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
