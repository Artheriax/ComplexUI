name: ML Runtime Overlay

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ml-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optional-ml:
    name: Optional ML runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Run tests with torch, vision, ONNX, xgboost, and lightgbm
        run: >-
          uv run
          --with "torch>=2.0"
          --with "torchvision>=0.17"
          --with "ultralytics>=8.3"
          --with "safetensors>=0.4"
          --with "onnxruntime>=1.18"
          --with "xgboost>=2.0"
          --with "lightgbm>=4.0"
          pytest
