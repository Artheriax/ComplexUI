name: ML Runtime Overlay

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ml-overlay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  optional-ml:
    name: Optional ML runtimes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Run tests with torch, vision, ONNX, xgboost, and lightgbm
        # torch, torchvision, ultralytics, safetensors and onnxruntime already
        # come from the dev group (index-pinned and mutually compatible in
        # uv.lock). Re-requesting them via --with re-resolves them from PyPI
        # without the project's CPU/CUDA index pinning, which can shadow the
        # locked builds or conflict with their exact transitive pins. Only
        # overlay the runtimes that are genuinely absent from the dev group.
        run: >-
          uv run
          --with "xgboost>=2.0"
          --with "lightgbm>=4.0"
          pytest
